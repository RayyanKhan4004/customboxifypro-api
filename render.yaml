services:
  - type: web
    name: customboxify-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
